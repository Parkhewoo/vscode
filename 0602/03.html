<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소객체 속성 조작</title>
    <script>

        window.onload = function () {
            let img1 = document.getElementById("img1");


            //    img1.src = "https://placehold.co/300x200";
            img1.src = "imgs/b.jpg";
            img1.width = 500;
            img1.height = 300;

        }

       function changeImage(btn) {
           if(btn.innerText === "동물 이미지 변경"){
            img1.src = "imgs/animal.jpg";
            btn.innerText = "배경 이미지 변경";
           } else {
            img1.src = "imgs/b.jpg";
            btn.innerText = "동물 이미지 변경";
           }
        }
        
    </script>
</head>

<body>
    <button onclick="changeImage(this)">동물 이미지 변경</button>
    <br><br>
    <img id="img1">
</body>

</html>
